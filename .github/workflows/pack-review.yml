name: Pack format review

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  validate:
    if: >
      github.actor != 'github-actions[bot]' &&
      contains(github.event.issue.title, '[pack]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch issue body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue view "${{ github.event.issue.number }}" --json body -q .body > /tmp/issue-body.txt

      - name: Validate pack format
        id: vp
        uses: ./.github/actions/validate-pack
        with:
          issue-body-file: /tmp/issue-body.txt

      - name: Mark format errors
        if: steps.vp.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ERRORS: ${{ steps.vp.outputs.errors }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" --remove-label "pack:format-ok" --add-label "pack:format-error" || true
          gh issue comment "${{ github.event.issue.number }}" --body "$(cat <<EOF
          ## ❌ 格式校验未通过

          请按以下问题修改后**重新编辑本 Issue**（或点 Reopen），机器人会自动复查：

          $ERRORS

          打包要求速查：
          - zip 根目录直接放 \`pack.json\` + 各档图片（不要多套一层文件夹也可以，机器人会自动下沉一层）
          - \`pack.json\`：\`schema: 1\`、\`id\` 与上方「套装 id」一致、第一档 \`min: 0\`、最后一档 \`max: null\`、档位连续不留空洞
          - 图片仅 \`*.webp\`/\`*.png\`，单张 ≤1.5MB，总体积 ≤15MB，且都被 tiers 引用
          - 字段与示例参见仓库内 \`scripts/validate-pack.mjs\` 与默认套装 \`assets/packs/default/\`
          EOF
          )"

      - name: Mark format ok
        if: steps.vp.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_ID: ${{ steps.vp.outputs.pack-id }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" --remove-label "pack:format-error" --add-label "pack:format-ok" || true
          gh issue comment "${{ github.event.issue.number }}" --body "$(cat <<EOF
          ## ✅ 格式校验通过

          套装 \`$PACK_ID\` 已通过自动校验，**等待仓库主审核**。

          审核通过后会给本 Issue 打上 \`pack:approved\` 标签，随后自动：
          1. 合入仓库 \`assets/packs/$PACK_ID/\`
          2. 部署 Worker，介绍页与 \`?pack=$PACK_ID\` 即刻可用

          提交者无需再操作；若审核中需要补充材料，仓库主会在本 Issue 下留言。
          EOF
          )"

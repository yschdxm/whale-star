name: Validate pack submission
description: Parse issue body, download zip, validate pack format
inputs:
  issue-body-file:
    description: Path to issue body text file
    required: true
outputs:
  pack-id:
    value: ${{ steps.parse.outputs.pack-id }}
  pack-name:
    value: ${{ steps.parse.outputs.pack-name }}
  zip-url:
    value: ${{ steps.parse.outputs.zip-url }}
  ok:
    description: "'true' if validation passed"
    value: ${{ steps.result.outputs.ok }}
  errors:
    value: ${{ steps.result.outputs.errors }}
runs:
  using: composite
  steps:
    - id: parse
      shell: bash
      run: |
        set -euo pipefail
        INFO=$(node scripts/parse-issue.mjs "${{ inputs.issue-body-file }}")
        echo "info=$INFO" >> "$GITHUB_OUTPUT"
        PACK_ID=$(echo "$INFO" | node -e "process.stdin.on('data',d=>{const j=JSON.parse(d);console.log(j.packId||'')})")
        PACK_NAME=$(echo "$INFO" | node -e "process.stdin.on('data',d=>{const j=JSON.parse(d);console.log(j.packName||'')})")
        ZIP_URL=$(echo "$INFO" | node -e "process.stdin.on('data',d=>{const j=JSON.parse(d);console.log(j.zipUrl||'')})")
        echo "pack-id=$PACK_ID" >> "$GITHUB_OUTPUT"
        echo "pack-name=$PACK_NAME" >> "$GITHUB_OUTPUT"
        echo "zip-url=$ZIP_URL" >> "$GITHUB_OUTPUT"

    - id: result
      shell: bash
      run: |
        set -uo pipefail
        ERRORS=""
        ok=true
        pack_id="${{ steps.parse.outputs.pack-id }}"
        zip_url="${{ steps.parse.outputs.zip-url }}"

        add_err() { ok=false; ERRORS="${ERRORS}
- $1"; }

        if [ -z "$pack_id" ]; then add_err "未填写「套装 id」"; fi
        if [ -z "$zip_url" ]; then add_err "未提供有效的「打包文件直链」（需要 https 直链 zip）"; fi

        if [ "$ok" = true ]; then
          rm -rf /tmp/packzip && mkdir -p /tmp/packzip
          if ! curl -fsSL --max-time 120 -o /tmp/pack.zip "$zip_url"; then
            add_err "无法下载 zip：$zip_url"
          fi
        fi

        if [ "$ok" = true ]; then
          if ! unzip -tq /tmp/pack.zip >/dev/null 2>&1; then
            add_err "下载内容不是合法 zip 文件"
          fi
        fi

        if [ "$ok" = true ]; then
          if unzip -Z1 /tmp/pack.zip | grep -E '(^/|\.\.)' >/dev/null 2>&1; then
            add_err "zip 内含非法路径（绝对路径或 ..），请重新打包"
          fi
        fi

        if [ "$ok" = true ]; then
          unzip -oq /tmp/pack.zip -d /tmp/packzip
          # If zip has a single top-level dir, descend into it
          entries=$(ls -A /tmp/packzip)
          if [ "$(echo "$entries" | wc -l)" -eq 1 ] && [ -d "/tmp/packzip/$entries" ]; then
            mv "/tmp/packzip/$entries" /tmp/packzip/inner
            shopt -s dotglob nullglob
            mv /tmp/packzip/inner/* /tmp/packzip/
            shopt -u dotglob nullglob
            rmdir /tmp/packzip/inner
          fi
          if ! node scripts/validate-pack.mjs /tmp/packzip "$pack_id" > /tmp/validate.out 2>&1; then
            add_err "格式校验未通过：$(tr '\n' ' ' < /tmp/validate.out | sed 's/ERROR: //g')"
          fi
        fi

        {
          echo "ok=$ok"
          echo "errors<<EOF"
          echo "$ERRORS"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
